      <fieldset>
        <legend>Mon formulaire :</legend>

        <p>
          <label for="immat_id">Immatriculation</label> :
          <input type="text"
                 placeholder="Ex : AA-123-BB"
                 name="immatriculation"
                 id="immat_id"
                 required />
        </p>

      
        <p>
          <label for="marque_id">Marque</label> :

                 placeholder="Ex : Peugeot"
                 name="marque"
                 id="marque_id" />

        <p>

                 placeholder="Ex : bleu"

                 id="couleur_id" />

        <p>
          <input type="submit" value="Envoyer" />
        </p>
      </fieldset>
    </form>
