  <script>
    // Lire la préférence une seule fois, avant le chargement du décor et des styles.
    let initialLightMode = false;
    try {
      initialLightMode = localStorage.getItem('office-theme') === 'light';
    } catch (error) {
      // Sans stockage disponible, le bureau démarre en thème nuit.
    }
    document.documentElement.classList.toggle('light-office', initialLightMode);
    // Le meuble mobile ne charge pas les grands décors du bureau.
    if (window.matchMedia('(min-width: 768px)').matches) {
      const officePreload = document.createElement('link');
      officePreload.rel = 'preload';
      officePreload.as = 'image';
      officePreload.dataset.officePreload = '';
      officePreload.href = initialLightMode ? './img/Bureau/bureau2.webp' : './img/Bureau/bureau4.webp';
      document.head.append(officePreload);
    }
  </script>

      <div class="profile-body">
        <p class="lead">Une expérience de terrain en restauration, en management et en gestion d’activité, enrichie par le développement web.</p>
        <p>Mon parcours s’est construit au contact des clients et des équipes. Cuisinier de métier, j’ai développé une activité de traiteur et de chef à domicile, puis dirigé pendant sept ans le restaurant Les Comédiens à Béziers.</p>
        <p>J’ai ensuite rejoint Lidl, où j’ai exercé comme chef caisse, puis adjoint manager. Accompagner les équipes, répartir le travail et suivre les priorités opérationnelles ont renforcé mon goût pour un management concret, fondé sur la présence et l’échange.</p>
        <p>Titulaire du titre professionnel de Développeur Web et Web Mobile obtenu en juin 2026, j’ajoute aujourd’hui une dimension numérique à ce parcours. Je conçois des sites et des outils en m’appuyant sur ma connaissance du terrain, avec une attention particulière portée à leur utilité et à leur simplicité d’utilisation.</p>
        <p class="profile-invitation">Ce bureau vous invite à découvrir mon parcours autrement. Cliquez sur les objets pour explorer mes compétences, consulter mon CV et mes diplômes, ou découvrir mes réalisations en cuisine, en management et dans le numérique. Chaque section apporte un éclairage concret sur mon expérience : à vous de choisir votre chemin.</p>
