name: Publier le bureau Talentys

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bureau-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer les fichiers sans Git
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.tar.gz" \
            --output "$RUNNER_TEMP/source.tar.gz"
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1

      - name: Préparer le bureau
        run: |
          mkdir -p _site
          cp index.html style.css script.js _site/
          cp -R img _site/img
          touch _site/.nojekyll

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Charger le bureau
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publier le bureau
        id: deployment
        uses: actions/deploy-pages@v4
